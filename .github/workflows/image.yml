# Builds ghcr.io/rivavolt/avatarcam-swap from this repository, a mirror of nixos-config's pkgs/avatarcam/cloud made by its publish-image.sh. The tag is the repository's root tree, so the same content always carries the same tag. The repository is public so the package is too, and RunPod pulls it without registry credentials.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: free disk for the CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/rivavolt/avatarcam-swap:${{ steps.tag.outputs.tag }}
            ghcr.io/rivavolt/avatarcam-swap:latest
          labels: org.opencontainers.image.source=https://github.com/rivavolt/avatarcam-swap
      - run: docker buildx imagetools inspect ghcr.io/rivavolt/avatarcam-swap:${{ steps.tag.outputs.tag }}
